<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Ethnic Barbie Diaries</title>

<style>
body{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:2rem;}
.wrap{max-width:420px;text-align:center;position:relative;z-index:2;}
</style>
<style>
/* ═══════════════════════════════════════════════════════
   JemUBW — KAWAII PASTEL Y2K THEME
   Win98 window chrome structure + kawaii pastel colors
   Like image 2: purple desktop, pink/lavender windows,
   blue title bars, soft pastel everything
═══════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Press+Start+2P&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap');

:root {
  /* ── DESKTOP ── */
  --desk:      #CC88FF;   /* medium purple desktop like image 2 */
  --desk2:     #BB66EE;   /* deeper purple */

  /* ── WIN98 CHROME — pastel version ── */
  --win-bar:   #7B68EE;   /* medium slate blue title bar */
  --win-bar2:  #9B8FFF;   /* lighter purple end */
  --win-body:  #FFE4F0;   /* soft pink window body */
  --win-body2: #FFF0F8;   /* lighter pink inner panels */
  --win-inset: #FFD6EC;   /* slightly deeper pink inset */

  /* ── 3D BORDER COLORS — pastel tinted ── */
  --win-bd-lt: #FFFFFF;   /* highlight edge */
  --win-bd:    #D4A0C8;   /* mid border */
  --win-bd-dk: #B070A0;   /* shadow edge */

  /* ── PINK TITLE BAR VARIANT ── */
  --pink-bar:  #FF69B4;   /* hot pink bar */
  --pink-bar2: #FFB6D9;   /* light pink end */

  /* ── ACCENT COLORS ── */
  --pink:      #FF69B4;   /* hot pink */
  --pink2:     #FFB6D9;   /* light pink */
  --pink3:     #FFE4F0;   /* blush */
  --purple:    #CC88FF;   /* desktop purple */
  --purple2:   #AA66DD;   /* medium purple */
  --lavender:  #E8D5FF;   /* soft lavender */
  --mint:      #C8FFE8;   /* mint green accent */
  --sky:       #C8E8FF;   /* baby blue accent */
  --yellow:    #FFF0A0;   /* soft yellow */

  /* ── TEXT ── */
  --win-txt:   #4A0060;   /* deep purple text (not black) */
  --win-txt2:  #ffffff;   /* title bar text */
  --muted:     #9966AA;   /* muted purple */

  /* ── SEMANTIC ── */
  --green:     #66BB88;
  --red:       #FF6688;
  --gold:      #FFCC66;
  --gold-d:    #AA7700;
  --green-l:   #D0FFE8;
  --red-l:     #FFD0DC;
  --gold-l:    #FFF0C0;

  /* ── FONTS ── */
  --head: 'Nunito', sans-serif;
  --scr:  'Press Start 2P', monospace;
  --sys:  'Nunito', 'DM Sans', sans-serif;
  --body: 'DM Sans', sans-serif;

  --nav-h: 52px;
  /* ══════════════════════════════════════════
     BACKWARD COMPAT ALIASES
     Maps old variable names → Y2K theme values
     Fixes all pages that used the old CSS
  ══════════════════════════════════════════ */

  /* Old pink system → Y2K pink */
  --pink-hot:      #FF3399;
  --pink-soft:     #FF88CC;
  --pink-pale:     #FFD0EE;
  --pink-blush:    #FFE8F4;
  --pink-border:   rgba(180,80,140,0.25);
  --pink-glass:    rgba(255,100,180,0.12);
  --pink-bar:      #FF69B4;

  /* Old ink/text system → Y2K purple text */
  --ink:           #4A0060;
  --ink2:          #7A0080;
  --mist:          #9966AA;
  --smoke:         #F8EEF8;
  --cream:         #FFF8FF;
  --white:         #FFFFFF;

  /* Old radius tokens → flat Y2K style */
  --r:             4px;
  --rr:            6px;
  --r-sm:          3px;
  --r-md:          5px;
  --r-lg:          6px;
  --radius-sm:     3px;
  --radius-md:     4px;
  --radius-lg:     6px;
  --radius-xl:     8px;
  --radius-pill:   50px;

  /* Old shadow tokens → Y2K flat shadows */
  --shadow-pink:   3px 3px 0 rgba(180,80,140,0.3);
  --shadow-soft:   2px 2px 0 rgba(180,80,140,0.2);
  --shadow-card:   2px 2px 0 rgba(100,0,80,0.15);
  --win-sh:        3px 3px 0 rgba(100,0,80,0.2);
  --win-bg:        var(--win-body);

  /* Old button tokens */
  --btn-bg:        #F0DCFF;
  --btn-bd:        #C080E0;

  /* Old font tokens */
  --font-display:  'Nunito', sans-serif;
  --font-script:   'Nunito', sans-serif;
  --font-body:     'DM Sans', sans-serif;

  /* Text hierarchy aliases */
  --text-1:        #4A0060;
  --text-2:        #7A0080;
  --text-3:        #9966AA;
  --text-4:        #BBA0CC;

  /* Misc */
  --lav:           #E8D5FF;
  --bg:            #CC88FF;
  --p:             #FF69B4;
  --p4:            #FFE4F0;
  --blue:          #7B68EE;
  --blue-l:        #E8E4FF;
  --orange:        #FF8844;
  --amber:         #FFAA44;
  --border:        rgba(180,80,140,0.2);
  --border-soft:   rgba(180,80,140,0.15);
  --card:          var(--win-body);
  --surface:       var(--win-body2);
}

/* ── RESET ─────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--sys);
  background:var(--desk);
  color:var(--win-txt);
  overflow-x:hidden;cursor:none;min-height:100dvh;
}
/* sparkle dot pattern on desktop like image 2 */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle, rgba(255,255,255,0.5) 1px, transparent 1px),
    radial-gradient(circle, rgba(255,255,255,0.25) 1px, transparent 1px),
    radial-gradient(circle, rgba(255,255,255,0.15) 2px, transparent 2px);
  background-size: 40px 40px, 20px 20px, 80px 80px;
  background-position: 0 0, 10px 10px, 5px 5px;
}
a{text-decoration:none;color:inherit;}
button{font-family:var(--sys);cursor:none;border:none;outline:none;}
input,textarea,select{font-family:var(--sys);outline:none;}
::-webkit-scrollbar{width:12px;background:var(--win-body);}
::-webkit-scrollbar-track{background:var(--win-inset);}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,var(--pink),var(--purple2));
  border-top:2px solid var(--win-bd-lt);border-left:2px solid var(--win-bd-lt);
  border-right:2px solid var(--win-bd-dk);border-bottom:2px solid var(--win-bd-dk);
}

/* ── CURSOR ─────────────────────────────── */
#y2k-cursor{position:fixed;pointer-events:none;z-index:99999;left:0;top:0;transition:none;}

/* ── PAGE WRAP ──────────────────────────── */
.page-wrap{position:relative;z-index:2;padding-top:var(--nav-h);min-height:100dvh;}

/* ══════════════════════════════════════════
   WINDOW CHROME — Win98 structure, kawaii colors
══════════════════════════════════════════ */
.win{
  background:var(--win-body);
  border-top:2px solid var(--win-bd-lt);
  border-left:2px solid var(--win-bd-lt);
  border-right:2px solid var(--win-bd-dk);
  border-bottom:2px solid var(--win-bd-dk);
  box-shadow:2px 2px 0 rgba(100,0,80,0.15);
}
.win-bar{
  background:linear-gradient(90deg,var(--win-bar),var(--win-bar2));
  padding:4px 5px 4px 7px;
  display:flex;align-items:center;justify-content:space-between;
  user-select:none;gap:4px;
}
.win-bar.pink-bar{
  background:linear-gradient(90deg,var(--pink-bar),var(--pink-bar2));
}
.win-bar.purple-bar{
  background:linear-gradient(90deg,var(--purple2),var(--purple));
}
.win-title{
  font-family:var(--head);font-size:12px;font-weight:800;
  color:#fff;letter-spacing:0.01em;
  display:flex;align-items:center;gap:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:1;text-shadow:1px 1px 0 rgba(0,0,0,0.2);
}
.win-title-icon{font-size:13px;}
.win-btns{display:flex;gap:2px;flex-shrink:0;}
.win-btn{
  width:16px;height:14px;
  background:var(--win-body);
  border-top:1px solid var(--win-bd-lt);
  border-left:1px solid var(--win-bd-lt);
  border-right:1px solid var(--win-bd-dk);
  border-bottom:1px solid var(--win-bd-dk);
  font-size:9px;font-weight:900;color:var(--win-txt);
  display:flex;align-items:center;justify-content:center;
  cursor:none;font-family:var(--sys);line-height:1;
}
.win-btn:hover{background:var(--pink2);}
.win-menu{
  background:var(--win-inset);border-bottom:1px solid var(--win-bd);
  padding:2px 4px;display:flex;gap:0;
}
.win-menu-item{
  font-size:12px;font-family:var(--head);font-weight:600;
  color:var(--win-txt);padding:2px 8px;cursor:none;
}
.win-menu-item:hover{background:var(--win-bar);color:#fff;}
.win-body{padding:1rem;}
.win-inner{
  background:var(--win-body2);
  border-top:2px solid var(--win-bd-dk);border-left:2px solid var(--win-bd-dk);
  border-right:2px solid var(--win-bd-lt);border-bottom:2px solid var(--win-bd-lt);
  padding:1rem;
}

/* ══════════════════════════════════════════
   NAVBAR
══════════════════════════════════════════ */
.navbar{
  position:fixed;top:0;left:0;right:0;height:var(--nav-h);
  background:linear-gradient(90deg,var(--pink3),var(--lavender),var(--pink3));
  border-top:2px solid var(--win-bd-lt);
  border-bottom:2px solid var(--win-bd-dk);
  box-shadow:0 2px 0 var(--win-bd);
  z-index:1000;
  display:flex;align-items:center;padding:4px 8px;gap:5px;
}
.nav-logo{
  font-family:var(--head);font-size:14px;font-weight:900;color:var(--win-txt);
  background:var(--win-body);
  border-top:2px solid var(--win-bd-lt);border-left:2px solid var(--win-bd-lt);
  border-right:2px solid var(--win-bd-dk);border-bottom:2px solid var(--win-bd-dk);
  padding:4px 12px;white-space:nowrap;flex-shrink:0;
  display:flex;align-items:center;gap:5px;
}
.nav-logo::before{content:'🌸';font-size:14px;}
.nav-logo:hover{background:var(--win-inset);}
.nav-sep{width:2px;height:32px;border-left:1px solid var(--win-bd-dk);border-right:1px solid var(--win-bd-lt);margin:0 3px;}
.nav-links{display:flex;align-items:center;gap:2px;flex-wrap:nowrap;overflow:hidden;flex:1;}
.nav-links a{
  font-family:var(--head);font-size:11px;font-weight:700;color:var(--win-txt);
  background:var(--win-body);
  border-top:1px solid var(--win-bd-lt);border-left:1px solid var(--win-bd-lt);
  border-right:1px solid var(--win-bd-dk);border-bottom:1px solid var(--win-bd-dk);
  padding:4px 10px;white-space:nowrap;transition:none;display:flex;align-items:center;gap:3px;
}
.nav-links a:hover{background:var(--win-inset);}
.nav-links a.active{
  background:var(--lavender);
  border-top:1px solid var(--win-bd-dk);border-left:1px solid var(--win-bd-dk);
  border-right:1px solid var(--win-bd-lt);border-bottom:1px solid var(--win-bd-lt);
  font-weight:800;
}
.nav-links .nav-cta{
  background:linear-gradient(135deg,var(--pink),var(--pink-bar));
  color:#fff;font-weight:800;border-color:var(--pink-bar);
}
.nav-links .nav-cta:hover{background:linear-gradient(135deg,var(--pink-bar),var(--purple2));color:#fff;}
.nav-tray{
  display:flex;align-items:center;gap:5px;
  background:var(--win-inset);
  border-top:1px solid var(--win-bd-dk);border-left:1px solid var(--win-bd-dk);
  border-right:1px solid var(--win-bd-lt);border-bottom:1px solid var(--win-bd-lt);
  padding:4px 10px;font-size:11px;font-family:var(--head);font-weight:700;
  color:var(--win-txt);margin-left:auto;flex-shrink:0;
}
.nav-hamburger{
  display:none;flex-direction:column;gap:4px;padding:5px;
  background:var(--win-body);
  border-top:1px solid var(--win-bd-lt);border-left:1px solid var(--win-bd-lt);
  border-right:1px solid var(--win-bd-dk);border-bottom:1px solid var(--win-bd-dk);
}
.nav-hamburger span{display:block;width:16px;height:2px;background:var(--win-txt);transition:all 0.2s;}
.nav-mobile{
  display:none;position:fixed;top:var(--nav-h);left:0;right:0;
  background:var(--win-body);border-bottom:2px solid var(--win-bd-dk);
  padding:4px;flex-direction:column;gap:2px;z-index:999;
}
.nav-mobile.open{display:flex;}
.nav-mobile a{
  font-family:var(--head);font-size:12px;font-weight:700;color:var(--win-txt);
  padding:8px 12px;
}
.nav-mobile a:hover,.nav-mobile a.active{background:var(--win-bar);color:#fff;}
@media(max-width:680px){.nav-links{display:none;}.nav-hamburger{display:flex;}}

/* ══════════════════════════════════════════
   TICKER
══════════════════════════════════════════ */
.ticker-wrap{
  background:linear-gradient(90deg,var(--pink),var(--purple2),var(--pink));
  border-bottom:2px solid rgba(100,0,80,0.2);
  padding:5px 0;overflow:hidden;position:relative;z-index:89;
}
.ticker-track{
  display:flex;gap:3rem;white-space:nowrap;
  animation:tickerScroll 35s linear infinite;
}
.ticker-track:hover{animation-play-state:paused;}
.ticker-item{
  font-family:var(--head);font-size:11px;font-weight:700;
  color:#fff;text-shadow:1px 1px 0 rgba(100,0,80,0.3);
  display:inline-flex;align-items:center;gap:6px;
}
.tc-up{color:#C8FFCC;font-weight:800;}
.tc-dn{color:#FFD0DC;font-weight:800;}
@keyframes tickerScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ══════════════════════════════════════════
   BUTTONS — kawaii pastel Win98
══════════════════════════════════════════ */
.btn{
  font-family:var(--head);font-size:12px;font-weight:700;
  color:var(--win-txt);background:var(--win-body);
  border-top:2px solid var(--win-bd-lt);border-left:2px solid var(--win-bd-lt);
  border-right:2px solid var(--win-bd-dk);border-bottom:2px solid var(--win-bd-dk);
  padding:5px 18px;cursor:none;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  white-space:nowrap;min-width:75px;
}
.btn:hover{background:var(--win-inset);}
.btn:active{
  border-top:2px solid var(--win-bd-dk);border-left:2px solid var(--win-bd-dk);
  border-right:2px solid var(--win-bd-lt);border-bottom:2px solid var(--win-bd-lt);
}
.btn-primary{background:var(--lavender);font-weight:800;border:2px solid var(--win-bd-dk);box-shadow:0 0 0 1px var(--win-bd-dk);}
.btn-primary:hover{background:#D4BBFF;}
.btn-pink{background:linear-gradient(135deg,var(--pink),var(--pink-bar));color:#fff;border-color:var(--pink-bar);}
.btn-pink:hover{background:linear-gradient(135deg,var(--pink-bar),var(--purple2));color:#fff;}
.btn-sm{font-size:11px;padding:4px 12px;}
.btn-full{width:100%;}

/* ══════════════════════════════════════════
   INPUTS — kawaii pastel
══════════════════════════════════════════ */
.inp{
  background:var(--win-body2);
  border-top:2px solid var(--win-bd-dk);border-left:2px solid var(--win-bd-dk);
  border-right:2px solid var(--win-bd-lt);border-bottom:2px solid var(--win-bd-lt);
  padding:5px 8px;font-family:var(--head);font-size:12px;font-weight:600;
  color:var(--win-txt);width:100%;
}
.inp:focus{outline:2px solid var(--pink);}
.inp::placeholder{color:var(--muted);}
select.inp{cursor:none;}

/* ══════════════════════════════════════════
   PROGRESS BAR
══════════════════════════════════════════ */
.prog-wrap{
  height:18px;background:var(--win-body2);
  border-top:2px solid var(--win-bd-dk);border-left:2px solid var(--win-bd-dk);
  border-right:2px solid var(--win-bd-lt);border-bottom:2px solid var(--win-bd-lt);
  overflow:hidden;padding:2px;
}
.prog-fill{
  height:100%;
  background:repeating-linear-gradient(
    90deg,var(--win-bar) 0,var(--win-bar) 10px,var(--win-bar2) 10px,var(--win-bar2) 12px
  );
  transition:width 0.5s ease;
}

/* ══════════════════════════════════════════
   PAGE TABS
══════════════════════════════════════════ */
.page-tabs{
  background:var(--win-inset);
  border-bottom:2px solid var(--win-bd-dk);
  position:sticky;top:var(--nav-h);z-index:90;
}
.tab-row{display:flex;overflow-x:auto;scrollbar-width:none;max-width:1200px;margin:0 auto;padding:4px 8px 0;gap:2px;}
.tab-row::-webkit-scrollbar{display:none;}
.pg-tab{
  font-family:var(--head);font-size:11px;font-weight:700;color:var(--win-txt);
  background:var(--win-body);
  border-top:2px solid var(--win-bd-lt);border-left:2px solid var(--win-bd-lt);
  border-right:2px solid var(--win-bd-dk);border-bottom:2px solid var(--win-body);
  padding:5px 14px;white-space:nowrap;cursor:none;position:relative;top:2px;
}
.pg-tab:hover{background:var(--win-inset);}
.pg-tab.active{background:var(--win-body);border-bottom:2px solid var(--win-body);z-index:1;font-weight:800;color:var(--pink);}
.pg-panel{display:none;}
.pg-panel.active{display:block;animation:fadeUp 0.15s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ══════════════════════════════════════════
   PAGE HERO
══════════════════════════════════════════ */
.page-hero{
  background:linear-gradient(135deg,var(--pink),var(--purple2),var(--pink));
  padding:4rem 0 3rem;text-align:center;position:relative;overflow:hidden;
  border-bottom:3px solid rgba(100,0,80,0.2);
}
.page-hero::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(255,255,255,0.2) 1px,transparent 1px);
  background-size:28px 28px;pointer-events:none;
}
.page-hero .display-title,.page-hero .section-title{color:#fff;text-shadow:1px 1px 0 rgba(100,0,80,0.3);}
.page-hero em{color:#FFE4F0 !important;}
.page-hero .eyebrow{color:rgba(255,255,255,0.85);}
.page-hero .lead{color:rgba(255,255,255,0.9);}

/* ══════════════════════════════════════════
   TYPOGRAPHY
══════════════════════════════════════════ */
.display-title,.section-title,.panel-title{
  font-family:var(--head);font-weight:900;color:var(--win-txt);line-height:1.15;
}
.display-title{font-size:clamp(26px,5vw,50px);}
.section-title{font-size:clamp(20px,4vw,34px);}
.panel-title{font-size:clamp(16px,3vw,24px);}
.display-title em,.section-title em,.panel-title em{color:var(--pink);font-style:normal;}
.eyebrow{font-family:var(--head);font-size:11px;font-weight:800;color:var(--muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.1em;}
.lead{font-size:14px;color:var(--muted);line-height:1.7;font-family:var(--body);}
.divider{width:60px;height:3px;background:var(--pink);margin:1rem 0;}
.dc{margin:1rem auto;}

/* ══════════════════════════════════════════
   ERROR DIALOG
══════════════════════════════════════════ */
.error-dialog{
  background:var(--win-body);
  border-top:2px solid var(--win-bd-lt);border-left:2px solid var(--win-bd-lt);
  border-right:2px solid var(--win-bd-dk);border-bottom:2px solid var(--win-bd-dk);
  min-width:240px;box-shadow:4px 4px 0 rgba(100,0,80,0.2);
}
.error-body{display:flex;align-items:flex-start;gap:12px;padding:14px;}
.error-icon{font-size:28px;flex-shrink:0;}
.error-msg{font-size:12px;font-family:var(--head);font-weight:600;color:var(--win-txt);line-height:1.6;}
.error-btns{display:flex;gap:6px;padding:8px 12px;justify-content:center;border-top:1px solid var(--win-bd);}

/* ══════════════════════════════════════════
   CD PLAYER WIDGET
══════════════════════════════════════════ */
.cdp{background:var(--win-body);}
.cdp-body{padding:10px;display:flex;gap:10px;align-items:center;}
.cdp-art{
  width:48px;height:48px;
  background:linear-gradient(135deg,var(--pink),var(--purple2));
  border-top:2px solid var(--win-bd-dk);border-left:2px solid var(--win-bd-dk);
  border-right:2px solid var(--win-bd-lt);border-bottom:2px solid var(--win-bd-lt);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
}
.cdp-info{flex:1;}
.cdp-field{display:flex;align-items:center;gap:5px;margin-bottom:4px;}
.cdp-label{font-size:11px;font-weight:800;font-family:var(--head);width:38px;flex-shrink:0;color:var(--win-txt);}
.cdp-value{
  flex:1;font-size:11px;font-family:var(--head);font-weight:700;
  background:var(--win-body2);
  border-top:1px solid var(--win-bd-dk);border-left:1px solid var(--win-bd-dk);

<script>
(function(){
'use strict';

/* CURSOR — Win98 arrow in white with black outline */
function initCursor(){
  const el=document.createElement('svg');
  el.id='y2k-cursor';
  el.setAttribute('width','20');el.setAttribute('height','24');
  el.setAttribute('viewBox','0 0 20 24');
  el.style.cssText='position:fixed;pointer-events:none;z-index:99999;left:0;top:0;transition:none;';
  el.innerHTML=`
    <polygon points="1,1 1,19 5,14 9,21 12,20 8,13 14,13" fill="white" stroke="black" stroke-width="1.5"/>
    <polygon points="1,1 1,19 5,14 9,21 12,20 8,13 14,13" fill="#000000" opacity="0"/>
  `;
  document.body.appendChild(el);
  document.addEventListener('mousemove',e=>{el.style.left=e.clientX+'px';el.style.top=e.clientY+'px';},{passive:true});
  /* Win98 error popup on click */
  document.addEventListener('click',e=>{
    if(Math.random()<0.08){ showErrorPopup(); }
  });
}

/* Win98 error popup — surprise element */
let errorCount=0;
const ERROR_MSGS=[
  'beauty.exe has stopped working',
  'Your haul is too iconic for this system',
  'Error: Swag bag value overflow',
  'Warning: You are TOO gorgeous',
  'Critical error: Budget not found',
];
function showErrorPopup(){
  if(errorCount>2)return; errorCount++;
  const popup=document.createElement('div');
  popup.style.cssText=`position:fixed;top:${80+Math.random()*200}px;left:${50+Math.random()*200}px;z-index:9990;animation:popIn 0.2s ease both;`;
  popup.innerHTML=`
    <div class="error-dialog" style="min-width:240px">
      <div class="win-bar pink-bar" style="background:linear-gradient(90deg,#c8005c,#ff3399)">
        <span class="win-title"><span class="win-title-icon">⚠️</span> Error</span>
        <div class="win-btns"><div class="win-btn" onclick="this.closest('.error-dialog').parentElement.remove()">✕</div></div>
      </div>
      <div class="error-body">
        <span class="error-icon">❌</span>
        <div>
          <div class="error-msg">${ERROR_MSGS[Math.floor(Math.random()*ERROR_MSGS.length)]}</div>
          <div class="error-msg" style="margin-top:4px">Click "Fix" to fix error.</div>
        </div>
      </div>
      <div class="error-btns">
        <button class="btn btn-primary btn-sm" onclick="this.closest('.error-dialog').parentElement.remove()">Fix</button>
        <button class="btn btn-sm" onclick="this.closest('.error-dialog').parentElement.remove()">Cancel</button>
      </div>
    </div>`;
  const css=document.createElement('style');
  css.textContent='@keyframes popIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}';
  document.head.appendChild(css);
  document.body.appendChild(popup);
  setTimeout(()=>popup.remove(),8000);
}

/* NAV */
function initNav(){
  const ham=document.getElementById('hamburger');
  const mob=document.getElementById('nav-mobile');
  if(ham&&mob){
    ham.addEventListener('click',()=>{
      mob.classList.toggle('open');
      const ss=ham.querySelectorAll('span');
      if(mob.classList.contains('open')){ss[0].style.transform='rotate(45deg) translate(5px,5px)';ss[1].style.opacity='0';ss[2].style.transform='rotate(-45deg) translate(5px,-5px)';}
      else ss.forEach(s=>{s.style.transform='';s.style.opacity='';});
    });
  }
  const path=window.location.pathname.split('/').pop()||'index.html';
  document.querySelectorAll('.nav-links a,.nav-mobile a').forEach(a=>{
    if((a.getAttribute('href')||'')===(path||'index.html'))a.classList.add('active');
  });
  /* live clock in tray */
  const tray=document.getElementById('nav-tray-time');
  if(tray){
    function updateClock(){tray.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
    updateClock();setInterval(updateClock,1000);
  }
}

/* COUNTDOWN */
function initCountdown(){
  const el=document.getElementById('countdown');
  if(!el)return;
  const target=new Date('2026-04-16T09:00:00-04:00');
  function pad(n){return String(n).padStart(2,'0');}
  function update(){
    const diff=target-new Date();
    if(diff<=0){el.innerHTML='<span style="font-family:var(--head);font-size:14px;font-weight:900;color:var(--pink)">🎉 UBW 2026 is happening NOW!</span>';return;}
    const d=Math.floor(diff/86400000),h=Math.floor((diff%86400000)/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
    el.innerHTML=`
      <div class="cd-row">
        <div class="cd-box"><span class="cd-num">${pad(d)}</span><span class="cd-lbl">Days</span></div>
        <span class="cd-sep blink">:</span>
        <div class="cd-box"><span class="cd-num">${pad(h)}</span><span class="cd-lbl">Hours</span></div>
        <span class="cd-sep blink">:</span>
        <div class="cd-box"><span class="cd-num">${pad(m)}</span><span class="cd-lbl">Min</span></div>
        <span class="cd-sep blink">:</span>
        <div class="cd-box"><span class="cd-num">${pad(s)}</span><span class="cd-lbl">Sec</span></div>
      </div>`;
  }
  update();setInterval(update,1000);
}

/* TOAST */
window.showToast=function(msg){
  let t=document.getElementById('y2k-toast');
  if(!t){t=document.createElement('div');t.id='y2k-toast';t.className='toast';document.body.appendChild(t);}
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),2800);
};

/* TABS */
window.showTab=function(id,btn){
  document.querySelectorAll('.pg-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.pg-tab').forEach(b=>b.classList.remove('active'));
  const panel=document.getElementById('tab-'+id);
  if(panel)panel.classList.add('active');
  if(btn)btn.classList.add('active');
  const tabs=document.querySelector('.page-tabs');
  if(tabs)window.scrollTo({top:tabs.offsetTop-10,behavior:'smooth'});
};

/* STARTUP DIALOG — exact match to Win98 dialog */
function initStartup(){
  if(sessionStorage.getItem('y2k-boot3'))return;
  sessionStorage.setItem('y2k-boot3','1');
  const overlay=document.createElement('div');
  overlay.id='y2k-overlay';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:99998;display:flex;align-items:center;justify-content:center;';
  overlay.innerHTML=`
    <div style="animation:popIn 0.25s ease both;">
      <div class="win" style="width:340px;">
        <div class="win-bar">
          <span class="win-title"><span class="win-title-icon">🌸</span> JemUBW.exe</span>
          <div class="win-btns">
            <div class="win-btn" title="Minimize">_</div>
            <div class="win-btn" title="Maximize">□</div>
            <div class="win-btn" onclick="document.getElementById('y2k-overlay').remove()" title="Close">✕</div>
          </div>
        </div>
        <div style="padding:24px;background:var(--win-body);text-align:center;">
          <div style="font-family:'Nunito',sans-serif;font-size:clamp(20px,5vw,28px);font-weight:900;color:var(--pink);margin-bottom:6px;text-shadow:1px 1px 0 rgba(200,0,80,0.2)">Beauty Made<br>Easier? 💗</div>
          <div style="font-size:12px;font-family:var(--sys);color:#444;margin-bottom:20px;">UBW 2026 · April 16 · Orlando FL</div>
          <div style="display:flex;gap:8px;justify-content:center;">
            <button class="btn btn-primary" onclick="document.getElementById('y2k-overlay').remove()" style="min-width:80px">Go!</button>
            <button class="btn" onclick="document.getElementById('y2k-overlay').remove()" style="min-width:80px">Cancel</button>
          </div>
          <div style="text-align:right;margin-top:14px">
            <svg width="16" height="20" viewBox="0 0 20 24" style="opacity:0.4"><polygon points="1,1 1,19 5,14 9,21 12,20 8,13 14,13" fill="black"/></svg>
          </div>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
}

/* SCROLL PROGRESS */
function initScrollBar(){
  const bar=document.createElement('div');
  bar.style.cssText='position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--pink),var(--purple),var(--pink));z-index:2001;width:0%;transition:width 0.1s linear;';
  document.body.appendChild(bar);
  window.addEventListener('scroll',()=>{
    const pct=window.scrollY/(document.documentElement.scrollHeight-window.innerHeight)*100;
    bar.style.width=Math.min(100,pct)+'%';
  },{passive:true});
}

/* REVEAL */
function initReveal(){
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('revealed','visible');obs.unobserve(e.target);}});
  },{threshold:0.06});
  document.querySelectorAll('[data-reveal],.fade-up').forEach(el=>obs.observe(el));
}

document.addEventListener('DOMContentLoaded',()=>{
  initCursor();initNav();initCountdown();initReveal();initScrollBar();initStartup();
});
})();

</script>

/**

 * 8. INFORMATION GAP THEORY (Loewenstein)

(function() {

  ═══════════════════════════════════════════════════════ */
  function initVisitorCounter() {
    const baseCount = 847;
    const variance = 60;
    let current = baseCount + Math.floor(Math.random() * variance);

    // Create floating social proof pill
    const pill = document.createElement('div');
    pill.id = 'visitor-pill';
    pill.style.cssText = `
      position:fixed;bottom:1.5rem;right:1.5rem;z-index:800;
      background:#fff;border:1px solid rgba(255,63,142,0.2);
      border-radius:50px;padding:8px 14px;
      display:flex;align-items:center;gap:7px;
      box-shadow:0 4px 20px rgba(45,10,30,0.12);
      font-family:'DM Sans',sans-serif;font-size:12px;
      color:#2D0A1E;font-weight:500;
      animation:slideInRight 0.5s 2s both;
      cursor:default;
    `;
    pill.innerHTML = `
      <span style="width:7px;height:7px;border-radius:50%;background:#FF3F8E;animation:pulse-v 1.5s infinite;flex-shrink:0"></span>
      <span id="visitor-count">${current}</span>&nbsp;people planning right now
    `;

    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideInRight{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

      @keyframes fadeOut{from{opacity:1}to{opacity:0;pointer-events:none}}
    `;
    document.head.appendChild(style);
    document.body.appendChild(pill);

    // Realistic fluctuation: +1/-1 every 8–15 seconds
    setInterval(() => {
      const delta = Math.random() > 0.48 ? 1 : -1;
      current = Math.max(baseCount - variance, Math.min(baseCount + variance * 2, current + delta));
      const el = document.getElementById('visitor-count');
      if (el) el.textContent = current;
    }, 8000 + Math.random() * 7000);
  }

  /* ═══════════════════════════════════════════════════════
     2. ACTIVITY FEED TICKER — Social Proof + FOMO
     Shows recent activity from "other users"
     Psychology: Herd behavior, fear of missing out
  ═══════════════════════════════════════════════════════ */
  const ACTIVITY_MESSAGES = [
    { emoji:'👸🏾', msg:'Mikayla added <strong>Cécred</strong> to her booth timer' },
    { emoji:'💄', msg:'Jasmine just built a <strong>$340 sample haul</strong> route' },
    { emoji:'🌸', msg:'Priya asked about <strong>K-beauty booths</strong> in Q&A' },

    { emoji:'🌀', msg:'Ryleigh added <strong>PATTERN + Rizos Curls</strong> to her list' },
    { emoji:'⭐', msg:'Destiny upvoted <strong>"Budget Mode" suggestion</strong>' },
    { emoji:'💗', msg:'Kezia saved <strong>Charlotte Tilbury makeover</strong> to reminders' },
    { emoji:'📊', msg:'<strong>342 people</strong> voted Cécred as #1 must-visit booth' },
    { emoji:'🎁', msg:'Maria calculated her swag bag ROI: <strong>$1,890 value</strong>' },
    { emoji:'🔥', msg:'<strong>Fenty Beauty</strong> booth forecast: <strong>Critical crowd level</strong>' },
    { emoji:'💡', msg:'Simone submitted a <strong>feature suggestion</strong> — 23 upvotes!' },
  ];

  function showActivityToast() {
    const activity = ACTIVITY_MESSAGES[Math.floor(Math.random() * ACTIVITY_MESSAGES.length)];
    const toast = document.createElement('div');
    toast.style.cssText = `
      position:fixed;bottom:4.5rem;right:1.5rem;z-index:799;
      background:#fff;border:1px solid rgba(255,63,142,0.2);
      border-radius:var(--r,14px);padding:10px 14px;
      display:flex;align-items:center;gap:9px;max-width:280px;
      box-shadow:0 4px 20px rgba(45,10,30,0.12);
      font-family:'DM Sans',sans-serif;font-size:12px;
      color:#5C2040;line-height:1.45;
      animation:slideInRight 0.4s both;
    `;
    toast.innerHTML = `<span style="font-size:16px;flex-shrink:0">${activity.emoji}</span><span>${activity.msg}</span>`;
    document.body.appendChild(toast);
    setTimeout(() => {
      toast.style.animation = 'fadeOut 0.4s both';
      setTimeout(() => toast.remove(), 400);
    }, 4500);
  }

  // Show first after 12 seconds, then every 25–45 seconds
  setTimeout(() => {
    showActivityToast();
    setInterval(showActivityToast, 25000 + Math.random() * 20000);
  }, 12000);

  /* ═══════════════════════════════════════════════════════
     3. SCARCITY BANNER — Time Pressure
     Only shown in final 4 days before event
     Psychology: Loss aversion, urgency, scarcity
  ═══════════════════════════════════════════════════════ */
  function initScarcityBanner() {
    const eventDate = new Date('2026-04-16T09:00:00-04:00');
    const now = new Date();
    const daysLeft = Math.ceil((eventDate - now) / 86400000);

    if (daysLeft > 4 || daysLeft <= 0) return;

    const messages = {
      4: { text: `Only 4 days until UBW 2026 — is your route built?`, cta: 'Build my route →', link: 'resources.html' },
      3: { text: `3 days left — have you set your arrival reminders?`, cta: 'Set reminders →', link: 'reminders.html' },
      2: { text: `2 days away! Don't forget: bring ID, ticket, and multiple tote bags`, cta: 'Packing list →', link: 'index.html#bring' },
      1: { text: `UBW 2026 is TOMORROW! Check-in opens at 8AM. You ready? 🎉`, cta: 'Final prep →', link: 'index.html' },
    };

    const m = messages[daysLeft];
    if (!m) return;

    const banner = document.createElement('div');
    banner.id = 'scarcity-banner';
    banner.style.cssText = `
      background:linear-gradient(135deg,#FF3F8E,#E8185A);
      color:#fff;padding:10px 1.5rem;
      display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
      font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;
      position:relative;z-index:1001;
      animation:slideInUp 0.4s both;
    `;
    banner.innerHTML = `
      <span>⏰ ${m.text}</span>
      <a href="${m.link}" style="background:rgba(255,255,255,0.2);color:#fff;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;text-decoration:none;transition:background 0.15s" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.2)'">${m.cta}</a>
      <button onclick="this.parentElement.style.animation='fadeOut 0.3s both';setTimeout(()=>this.parentElement.remove(),300)" style="background:none;border:none;color:rgba(255,255,255,0.7);font-size:18px;cursor:pointer;padding:0;line-height:1;margin-left:8px">×</button>
    `;
    document.body.insertBefore(banner, document.body.firstChild);
    // Push navbar down
    const nav = document.querySelector('.navbar');
    if (nav) nav.style.top = banner.offsetHeight + 'px';
  }

  /* ═══════════════════════════════════════════════════════
     4. SHARE TRIGGERS — Viral Loop
     Makes key moments easily shareable
     Psychology: Social currency, identity signaling
  ═══════════════════════════════════════════════════════ */
  window.shareResult = function(text) {
    const shareText = text || 'Planning my UBW 2026 expo day with @JemUBW! 💗 #UBW2026 #BeautyMadeEasier';
    if (navigator.share) {
      navigator.share({ title: 'My UBW 2026 Plan', text: shareText, url: window.location.href })
        .catch(() => fallbackCopy(shareText));
    } else {
      fallbackCopy(shareText);
    }
  };

  function fallbackCopy(text) {
    navigator.clipboard.writeText(text).then(() => {
      showMicroToast('Copied to clipboard! Paste in your story 💗');
    }).catch(() => {
      prompt('Copy and share this:', text);
    });
  }

  /* ═══════════════════════════════════════════════════════
     5. MICRO TOAST — Instant Feedback
     Psychology: Operant conditioning, reward loop
  ═══════════════════════════════════════════════════════ */
  window.showMicroToast = function(msg, type = 'default') {
    let existing = document.getElementById('micro-toast');
    if (existing) existing.remove();
    const t = document.createElement('div');
    t.id = 'micro-toast';
    const colors = { default: '#2D0A1E', success: '#15803D', warn: '#D97706' };
    t.style.cssText = `
      position:fixed;bottom:1.5rem;left:50%;
      transform:translateX(-50%) translateY(16px);
      background:${colors[type]||colors.default};color:#fff;
      padding:11px 22px;border-radius:50px;
      font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;
      z-index:9998;opacity:0;transition:all 0.28s cubic-bezier(0.16,1,0.3,1);
      white-space:nowrap;pointer-events:none;
      box-shadow:0 8px 32px rgba(0,0,0,0.25);
    `;
    t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(() => {
      t.style.opacity = '1';
      t.style.transform = 'translateX(-50%) translateY(0)';
    });
    setTimeout(() => {
      t.style.opacity = '0';
      t.style.transform = 'translateX(-50%) translateY(16px)';
      setTimeout(() => t.remove(), 280);
    }, 2600);
  };

  /* ═══════════════════════════════════════════════════════
     6. SCROLL PROGRESS BAR — Completion Trigger
     Psychology: Zeigarnik effect (incomplete = tension)
     Users want to see the bar fill — they scroll further
  ═══════════════════════════════════════════════════════ */
  function initScrollProgress() {
    const bar = document.createElement('div');
    bar.style.cssText = `
      position:fixed;top:0;left:0;height:3px;
      background:linear-gradient(90deg,#FF3F8E,#E8A020);
      z-index:2000;width:0%;
      transition:width 0.1s linear;
      box-shadow:0 0 8px rgba(255,63,142,0.5);
    `;
    document.body.appendChild(bar);
    window.addEventListener('scroll', () => {
      const scrolled = window.scrollY;
      const total = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = Math.min(100, (scrolled / total) * 100) + '%';
    }, { passive: true });
  }

  /* ═══════════════════════════════════════════════════════
     7. INTERSECTION OBSERVER — Reveal Animations
     Psychology: Progressive disclosure, curiosity
     Content appearing = anticipation reward
  ═══════════════════════════════════════════════════════ */
  function initRevealAnimations() {
    const style = document.createElement('style');
    style.textContent = `
      [data-reveal]{opacity:0;transform:translateY(28px);transition:opacity 0.6s cubic-bezier(0.16,1,0.3,1),transform 0.6s cubic-bezier(0.16,1,0.3,1);}
      [data-reveal].revealed{opacity:1;transform:translateY(0);}
      [data-reveal][delay-1]{transition-delay:0.1s;}
      [data-reveal][delay-2]{transition-delay:0.2s;}
      [data-reveal][delay-3]{transition-delay:0.3s;}
      [data-reveal][delay-4]{transition-delay:0.4s;}
      .fade-up{opacity:0;transform:translateY(32px);transition:opacity 0.7s cubic-bezier(0.16,1,0.3,1),transform 0.7s cubic-bezier(0.16,1,0.3,1);}
      .fade-up.visible{opacity:1;transform:translateY(0);}
      .delay-2{transition-delay:0.18s;}
      .delay-3{transition-delay:0.32s;}
    `;
    document.head.appendChild(style);

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('revealed', 'visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

    document.querySelectorAll('[data-reveal], .fade-up').forEach(el => observer.observe(el));
  }

  /* ═══════════════════════════════════════════════════════
     8. URGENCY COUNTDOWN — Loss Aversion
     Multi-context: used on hero, reminders, ticker
     Psychology: Time pressure, FOMO, loss aversion
  ═══════════════════════════════════════════════════════ */
  window.initCountdown = function(containerId, compact = false) {
    const el = document.getElementById(containerId);
    if (!el) return;
    const target = new Date('2026-04-16T09:00:00-04:00');

    function pad(n) { return String(n).padStart(2, '0'); }
    function update() {
      const diff = target - new Date();
      if (diff <= 0) {
        el.innerHTML = compact
          ? '<span style="color:#FF3F8E;font-weight:700">Happening NOW! 🎉</span>'
          : '<div style="font-size:1.5rem;font-weight:900;color:#FF3F8E">🎉 It\'s happening RIGHT NOW!</div>';
        return;
      }
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      if (compact) {
        el.innerHTML = `<span style="font-weight:700;color:var(--pink,#FF3F8E)">${d}d ${pad(h)}h ${pad(m)}m ${pad(s)}s</span>`;
      } else {
        el.innerHTML = `
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <div class="countdown-item"><span class="countdown-num">${pad(d)}</span><span class="countdown-lbl">Days</span></div>
            <div class="countdown-sep">:</div>
            <div class="countdown-item"><span class="countdown-num">${pad(h)}</span><span class="countdown-lbl">Hours</span></div>
            <div class="countdown-sep">:</div>
            <div class="countdown-item"><span class="countdown-num">${pad(m)}</span><span class="countdown-lbl">Min</span></div>
            <div class="countdown-sep">:</div>
            <div class="countdown-item"><span class="countdown-num">${pad(s)}</span><span class="countdown-lbl">Sec</span></div>
          </div>`;
      }
    }
    update();
    setInterval(update, 1000);
  };

  /* ═══════════════════════════════════════════════════════
     9. JSON-LD STRUCTURED DATA — SEO Rich Snippets
     Gets Google to show event details directly in search
     Traffic source: organic search, Google Event cards
  ═══════════════════════════════════════════════════════ */

            { "@type": "Question", "name": "What is in the Ulta Beauty World swag bag?", "acceptedAnswer": { "@type": "Answer", "text": "The UBW 2026 swag bag is estimated at $2,000+ in value, containing full-size and travel-size products from featured brands." } },

  /* ═══════════════════════════════════════════════════════
     10. ENGAGEMENT HOOKS — Time-on-Page
     Psychology: Curiosity gap, progressive disclosure
  ═══════════════════════════════════════════════════════ */
  function initEngagementHooks() {
    // Tab title switcher — recaptures attention when user tabs away
    const originalTitle = document.title;
    let tabAway = false;
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        tabAway = true;
        document.title = '💗 Come back! UBW is in 4 days…';
      } else if (tabAway) {
        tabAway = false;
        document.title = originalTitle;
        // Show re-engagement message
        setTimeout(() => showMicroToast('Welcome back! 💗 Your plan is still here'), 500);
      }
    });

    // Exit intent — show value reminder when mouse leaves window
    let exitShown = false;
    document.addEventListener('mouseleave', e => {
      if (e.clientY <= 0 && !exitShown && sessionStorage.getItem('exit-shown') !== '1') {
        exitShown = true;
        sessionStorage.setItem('exit-shown', '1');
        showExitModal();
      }
    });
  }

  function showExitModal() {
    const overlay = document.createElement('div');
    overlay.style.cssText = `position:fixed;inset:0;background:rgba(45,10,30,0.6);z-index:9990;backdrop-filter:blur(4px);animation:fadeIn 0.3s both;`;
    const modal = document.createElement('div');
    modal.style.cssText = `
      position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9991;
      background:#fff;border-radius:24px;padding:2.5rem;max-width:420px;width:90%;
      text-align:center;box-shadow:0 24px 80px rgba(45,10,30,0.3);
      animation:scaleIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
    `;
    modal.innerHTML = `
      <div style="font-size:48px;margin-bottom:12px">💗</div>
      <div style="font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:#2D0A1E;margin-bottom:8px">Before you go…</div>
      <p style="font-size:14px;color:#C8809A;line-height:1.7;margin-bottom:1.5rem">Your UBW 2026 planner is free and saved right here. Don't lose your booth list — bookmark this page so you can come back anytime. 💗</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button onclick="this.closest('div[style*=fixed]').nextSibling.remove();this.closest('div[style*=fixed]').remove()" style="padding:11px 22px;border-radius:50px;background:linear-gradient(135deg,#FF3F8E,#E8185A);color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer">Stay & keep planning 💗</button>
        <button onclick="this.closest('div[style*=fixed]').nextSibling.remove();this.closest('div[style*=fixed]').remove()" style="padding:11px 22px;border-radius:50px;background:transparent;color:#C8809A;font-size:13px;border:1.5px solid rgba(255,63,142,0.2);cursor:pointer">Maybe later</button>
      </div>
    `;
    const extraStyle = document.createElement('style');
    extraStyle.textContent = `@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes scaleIn{from{opacity:0;transform:translate(-50%,-50%) scale(0.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}`;
    document.head.appendChild(extraStyle);
    document.body.appendChild(modal);
    document.body.appendChild(overlay);
    overlay.addEventListener('click', () => { modal.remove(); overlay.remove(); });
  }

  /* ═══════════════════════════════════════════════════════
     11. WORD-OF-MOUTH PROMPT — Viral sharing
     Psychology: Social currency (share what makes you look good)
  ═══════════════════════════════════════════════════════ */
  function initSharePrompt() {
    // After 3 minutes, show a soft share nudge
    setTimeout(() => {
      const spent = parseInt(sessionStorage.getItem('time-spent') || '0');
      if (spent < 2 || sessionStorage.getItem('share-shown')) return;
      sessionStorage.setItem('share-shown', '1');
      showMicroToast('Loving the site? Share it with your expo crew 💗', 'default');
    }, 180000);

    // Track time on page
    let seconds = 0;
    setInterval(() => {
      seconds++;
      sessionStorage.setItem('time-spent', String(Math.floor(seconds / 60)));
    }, 1000);
  }

  /* ═══════════════════════════════════════════════════════
     12. CLOUDFLARE WORKER API WRAPPER
     Replaces direct API calls and corsproxy.io
  ═══════════════════════════════════════════════════════ */
  const WORKER_URL = 'https://jemubw-proxy.YOUR-SUBDOMAIN.workers.dev';
  // ↑ Replace with your actual Cloudflare Worker URL after deploying

  window.JemAPI = {
    // Claude AI (server-side key — never exposed)
    async claude(messages, system, maxTokens = 800) {
      const res = await fetch(`${WORKER_URL}/claude`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: maxTokens,
          messages,
          system,
        }),
      });
      const data = await res.json();
      return (data.content || []).map(c => c.text || '').join('').trim();
    },

    // Yahoo Finance stock data (via worker proxy, cached 15 min)
    async stock(ticker, range = '1mo') {
      const res = await fetch(`${WORKER_URL}/stock?ticker=${ticker}&range=${range}`);
      return res.json();
    },

    // General CORS proxy (Nitter, Sephora, etc.)
    async proxy(url) {
      const res = await fetch(`${WORKER_URL}/proxy?url=${encodeURIComponent(url)}`);
      return res.text();
    },
  };

  /* ═══════════════════════════════════════════════════════
     INIT — run everything
  ═══════════════════════════════════════════════════════ */
  document.addEventListener('DOMContentLoaded', () => {
    initScrollProgress();
    initRevealAnimations();
    initVisitorCounter();
    initScarcityBanner();
    initEngagementHooks();
    initSharePrompt();
    injectStructuredData();

    // Start activity feed after 15 seconds (not immediate — feels more natural)
    setTimeout(() => {}, 15000);
  });

})();
